<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHO is Phil Richards?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&family=Crimson+Pro:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --void: #06060d;
  --surface: rgba(10, 10, 18, 0.92);
  --border: rgba(255,255,255,0.05);
  --border-hover: rgba(255,255,255,0.12);
  --text: #d4d0cc;
  --text-bright: #f0eeeb;
  --text-muted: #6b6575;
  --portfolio: #e8764e;
  --experience: #a475d6;
  --skills: #4ab8c2;
  --education: #5cc98e;
  --about: #e05577;
  --display: 'Space Grotesk', system-ui, sans-serif;
  --body: 'Space Grotesk', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--void);
  color: var(--text);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
canvas { display: block; touch-action: none; }

/* LOADER */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--void);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-orb {
  width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--portfolio), transparent 70%);
  animation: lpulse 1.4s ease-in-out infinite;
}
@keyframes lpulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.25); opacity: 1; }
}
.loader-text {
  margin-top: 1.5rem; font-size: 0.7rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-muted);
}

/* SCENE */
#scene-container { position: fixed; inset: 0; z-index: 1; }

/* TOP BAR */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 1.4rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand {
  font-family: var(--display); font-size: 1.3rem;
  font-weight: 500; color: var(--portfolio);
}
.brand em { font-style: italic; }

/* FILTERS */
#filters {
  position: fixed; top: 4.5rem; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
}
.fbtn {
  font-family: var(--body); padding: 6px 14px; border-radius: 100px;
  font-size: 0.68rem; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer;
  border: 1px solid var(--border); background: rgba(255,255,255,0.02);
  color: var(--text-muted); transition: all 0.25s ease;
  backdrop-filter: blur(10px);
  touch-action: manipulation;
}
.fbtn:hover { border-color: var(--border-hover); color: var(--text); }
.fbtn.on { background: rgba(255,255,255,0.06); color: var(--text-bright); border-color: rgba(255,255,255,0.15); }
.fbtn[data-c="portfolio"].on { color: var(--portfolio); border-color: var(--portfolio); }
.fbtn[data-c="experience"].on { color: var(--experience); border-color: var(--experience); }
.fbtn[data-c="skills"].on { color: var(--skills); border-color: var(--skills); }
.fbtn[data-c="education"].on { color: var(--education); border-color: var(--education); }
.fbtn[data-c="about"].on { color: var(--about); border-color: var(--about); }

/* TOOLTIP */
#tip {
  position: fixed; z-index: 15; pointer-events: none;
  font-size: 0.72rem; font-weight: 500; color: var(--text-bright);
  padding: 5px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px;
  backdrop-filter: blur(14px); opacity: 0; transition: opacity 0.12s ease;
  white-space: nowrap;
}
#tip.vis { opacity: 1; }

/* DETAIL PANEL */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width:35%; min-width: 333px; max-width: 94vw; z-index: 20;
  background: var(--surface); border-left: 1px solid var(--border);
  backdrop-filter: blur(40px) saturate(1.3);
  transform: translateX(105%);
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column; overflow: hidden;
}
#panel.open { transform: translateX(0); }
.ph {
  padding: 2rem 2rem 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  flex-shrink: 0;
}
.pclose {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; transition: all 0.2s; flex-shrink: 0;
  touch-action: manipulation;
}
.pclose:hover { background: rgba(255,255,255,0.04); color: var(--text-bright); }
.pcat {
  font-family: var(--mono); font-size: 0.62rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 500; margin-bottom: 0.5rem;
}
.ptitle {
  font-family: var(--display); font-size: 1.65rem;
  font-weight: 500; line-height: 1.25; color: var(--text-bright);
  margin-bottom: 0.25rem;
}
.psub { font-size: 0.82rem; color: var(--text-muted); }
.pbody {
  padding: 1.6rem 2rem 2.5rem;
  overflow-y: auto; flex: 1;
  touch-action: pan-y;
}
.pbody::-webkit-scrollbar { width: 3px; }
.pbody::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
.pimg { width: 100%; border-radius: 6px; margin-bottom: 1rem; display: block; object-fit: cover; }
.pvid { width: 100%; border-radius: 6px; margin-bottom: 1rem; display: block; aspect-ratio: 16/9; background: #000; }
.pdesc { font-size: 0.85rem; line-height: 1.75; color: var(--text); margin-bottom: 1.5rem; }
.pdiv { height: 1px; background: var(--border); margin-bottom: 1.5rem; }
.plbl {
  font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 0.6rem; font-weight: 500;
}
.pmeta { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1.5rem; }
.mval { font-size: 0.82rem; color: var(--text); }
.mval .ml {
  font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 0.15rem; font-family: var(--mono);
}
.ptags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1.5rem; }
.ptag {
  font-family: var(--mono); font-size: 0.65rem; padding: 4px 10px;
  border-radius: 4px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.04); color: var(--text-muted);
}
.plinks { display: flex; flex-direction: column; gap: 0.5rem; }
.plnk {
  font-size: 0.8rem; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: opacity 0.2s;
}
.plnk:hover { opacity: 0.65; }
.plnk::before { content: '\2192'; }

/* BOTTOM BAR */
#bbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  padding: 1.25rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
#bbar > * { pointer-events: auto; }
.navbtns { display: flex; gap: 6px; }
.nbtn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border); background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px); color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 1rem; transition: all 0.2s;
  touch-action: manipulation;
}
.nbtn:hover { background: rgba(255,255,255,0.06); color: var(--text-bright); }
.nbtn.active { background: rgba(255,255,255,0.06); color: var(--text-bright); border-color: var(--border-hover); }
.hint {
  font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.06em;
  animation: hfade 7s ease 2.5s forwards; opacity: 0;
}
@keyframes hfade {
  0% { opacity: 0; } 12% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { opacity: 0; }
}

/* PANEL NAV FOOTER */
.pnav {
  padding: 0.9rem 2rem 1.4rem;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border); flex-shrink: 0; gap: 0.5rem;
}
.pnavbtn {
  font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 7px 15px; border-radius: 100px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.02);
  touch-action: manipulation;
  color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 5px;
}
.pnavbtn:not(:disabled):hover { background: rgba(255,255,255,0.06); color: var(--text-bright); border-color: var(--border-hover); }
.pnavbtn:disabled { opacity: 0.22; cursor: default; }
.pnavpos { font-family: var(--mono); font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.08em; }

/* SIDE NAV */
#sidenav {
  position: fixed; z-index: 25;
  max-height: 55vh; overflow-y: auto; overflow-x: hidden;
  padding: 0.6rem 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px;
  backdrop-filter: blur(40px) saturate(1.3);
  width: 195px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease, width 0.22s ease;
}
#sidenav.open { opacity: 1; pointer-events: auto; }
#sidenav:hover { width: 340px; }
#sidenav::-webkit-scrollbar { width: 3px; }
#sidenav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
.sn-label {
  font-family: var(--mono); font-size: 0.58rem; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0 1.25rem 0.6rem; display: block; white-space: nowrap;
}
.sn-item {
  font-family: var(--body); font-size: 0.72rem; font-weight: 400;
  color: var(--text-muted); padding: 9px 1.5rem 9px 1.25rem;
  cursor: pointer; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%;
  border-left: 2px solid transparent;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.sn-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.sn-item.sn-active { font-weight: 500; }

/* ═══════════════════════════════════════════
   SETTINGS PANEL (hidden customizer)
   ═══════════════════════════════════════════ */
#settings-toggle.active { transform: rotate(60deg); }

#settings-panel {
  position: fixed; bottom: 4.5rem; left: 2rem; z-index: 29;
  width: 270px; padding: 1.2rem;
  max-height: calc(100vh - 7rem); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; backdrop-filter: blur(40px) saturate(1.3);
  opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.96);
  transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
#settings-panel::-webkit-scrollbar { width: 3px; }
#settings-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
#settings-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

.settings-section { margin-bottom: 1rem; }
.settings-section:last-child { margin-bottom: 0; }
.settings-label {
  font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;
  font-weight: 500; display: block;
}

.palette-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
}
.palette-swatch {
  height: 36px; border-radius: 6px; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.palette-swatch:hover { border-color: rgba(255,255,255,0.2); transform: scale(1.05); }
.palette-swatch.active { border-color: var(--text-bright); }
.palette-swatch .ps-colors {
  display: flex; width: 100%; height: 100%;
}
.palette-swatch .ps-colors span { flex: 1; }
.palette-name {
  position: absolute; bottom: 1px; left: 0; right: 0; text-align: center;
  font-size: 0.42rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.8); text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  font-family: var(--mono); font-weight: 500;
}

.font-list {
  display: flex; flex-direction: column; gap: 4px;
}
.font-option {
  padding: 6px 10px; border-radius: 6px; cursor: pointer;
  font-size: 0.72rem; color: var(--text-muted);
  border: 1px solid transparent; transition: all 0.2s;
  background: rgba(255,255,255,0.01);
}
.font-option:hover { color: var(--text); background: rgba(255,255,255,0.03); border-color: var(--border); }
.font-option.active { color: var(--text-bright); border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); }

.color-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.color-chip {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s; flex-shrink: 0;
}
.color-chip:hover { transform: scale(1.15); }
.color-chip.active { border-color: var(--text-bright); }

.drift-speed-row { display: flex; gap: 4px; }
.drift-speed-btn {
  flex: 1; padding: 5px 0; border-radius: 6px; cursor: pointer;
  font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted);
  border: 1px solid var(--border); background: rgba(255,255,255,0.01);
  transition: all 0.2s; text-align: center;
}
.drift-speed-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); border-color: var(--border-hover); }
.drift-speed-btn.active { color: var(--text-bright); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }

.space-hex-input {
  margin-top: 7px; width: 100%;
  padding: 5px 10px; border-radius: 6px;
  font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.06em;
  color: var(--text-muted); background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); outline: none; transition: border-color 0.2s;
  box-sizing: border-box;
}
.space-hex-input:focus { border-color: var(--border-hover); color: var(--text); }
.space-hex-input::placeholder { opacity: 0.4; }

.adv-toggle {
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  user-select: none; margin-bottom: 0 !important;
}
.adv-toggle:hover { color: var(--text); }
.adv-toggle-arrow { font-size: 0.55rem; transition: transform 0.2s; display: inline-block; }
.adv-toggle.open .adv-toggle-arrow { transform: rotate(90deg); }
.adv-section { padding-top: 0.65rem; display: none; }
.adv-section.open { display: block; }
.slider-row { margin-bottom: 0.55rem; }
.slider-label-row {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.28rem;
}
.slider-val { color: var(--text); font-size: 0.55rem; }
input[type=range].adv-slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
  background: rgba(255,255,255,0.10); border-radius: 3px;
  outline: none; cursor: pointer;
}
input[type=range].adv-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-bright); cursor: pointer;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}
.native-color-picker {
  position: absolute; opacity: 0; pointer-events: none;
  width: 0; height: 0; border: none; padding: 0;
}

@media (max-width: 640px) {
  #panel { width: 100vw; max-width: 100vw; }
  #filters { top: auto; bottom: 5rem; left: 0.75rem; right: 0.75rem; transform: none; }
  #topbar, #bbar { padding: 1rem; }
  #sidenav { display: none; }

  #topbar {
    flex-direction: column;
    align-items: flex-start;
    padding: 0.8rem 1rem;
    gap: 0.25rem;
  }
  #topbar > div:last-child { font-size: 0.6rem; }
  .brand { font-size: 1.1rem; }

  #filters {
    top: auto;
    bottom: 4.5rem;
    left: 0;
    right: 0;
    padding: 0 0.5rem;
    transform: none;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 3px;
  }
  #filters::-webkit-scrollbar { display: none; }
  .fbtn {
    font-size: clamp(0.44rem, 1.85vw, 0.6rem);
    padding: 5px clamp(5px, 1.8vw, 10px);
    letter-spacing: 0.02em;
    flex: 0 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  .ph { padding: 1.2rem 1rem 0; }
  .ptitle { font-size: 1.3rem; }
  .pbody { padding: 1rem 1rem 2rem; }
  .pmeta { grid-template-columns: 1fr; }
  .ptag { font-size: 0.58rem; padding: 3px 8px; }

  #bbar { padding: 0.6rem 1rem; }
  .hint { display: none; }
  .nbtn { width: 42px; height: 42px; }

  #topbar { padding-top: max(0.8rem, env(safe-area-inset-top)); }
  #bbar { padding-bottom: max(0.6rem, env(safe-area-inset-bottom)); }

  #settings-panel { bottom: 3.5rem; left: 1rem; width: 230px; }
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-orb"></div>
  <p class="loader-text">Mapping Phil's Universe...</p>
</div>

<div id="scene-container"></div>
<div id="tip"></div>

<div id="topbar">
  <div class="brand"><span id="brand-prefix">Who is </span><em>Phil Richards </em><span id="brand-suffix">?</span></div>
  <div style="font-size:0.75rem;color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)">philrich.wav@icloud.com <br> 828.228.3607</div>
</div>

<div id="filters">
  <button class="fbtn on" data-c="all">All</button>
  <button class="fbtn" data-c="about">About</button>
  <button class="fbtn" data-c="education">Education</button>
  <button class="fbtn" data-c="experience">Experience</button>
  <button class="fbtn" data-c="portfolio">Portfolio</button>
  <button class="fbtn" data-c="skills">Skills</button>
</div>

<div id="panel">
  <div class="ph">
    <div style="min-width:0">
      <div class="pcat" id="p-cat"></div>
      <h2 class="ptitle" id="p-title"></h2>
      <p class="psub" id="p-sub"></p>
    </div>
    <button class="pclose" id="p-close">&times;</button>
  </div>
  <div class="pbody" id="p-body"></div>
  <div class="pnav" id="p-nav"></div>
</div>

<div id="sidenav"></div>

<div id="bbar">
  <div class="navbtns">
    <button class="nbtn" id="nav-home" title="Reset view">&#8962;</button>
    <button class="nbtn" id="nav-zin" title="Zoom in">+</button>
    <button class="nbtn" id="nav-zout" title="Zoom out">&minus;</button>
    <button class="nbtn" id="settings-toggle" title="Appearance">&#9881;</button>
  </div>
  <div class="hint">Click nodes to explore &middot; Drag to orbit &middot; Scroll to zoom</div>
</div>

<div id="settings-panel">
  <div class="settings-section">
    <span class="settings-label">Color Palette</span>
    <div class="palette-grid" id="palette-grid"></div>
  </div>
  <div class="settings-section">
    <span class="settings-label">Display Font</span>
    <div class="font-list" id="font-list"></div>
  </div>
  <div class="settings-section" style="position:relative">
    <span class="settings-label">Space Color</span>
    <div class="color-chip-row" id="space-color-list"></div>
    <input class="space-hex-input" id="space-hex-input" type="text" maxlength="7" placeholder="Custom hex e.g. #0a0014" spellcheck="false">
    <input type="color" id="space-color-picker" class="native-color-picker" value="#06060b">
  </div>
  <div class="settings-section" style="position:relative">
    <span class="settings-label">Star Color</span>
    <div class="color-chip-row" id="star-color-list"></div>
    <input class="space-hex-input" id="star-hex-input" type="text" maxlength="7" placeholder="Custom tint e.g. #ffe4b5" spellcheck="false">
    <input type="color" id="star-color-picker" class="native-color-picker" value="#fff8e7">
  </div>
  <div class="settings-section">
    <span class="settings-label">Drift Speed</span>
    <div class="drift-speed-row" id="drift-speed-row"></div>
  </div>
  <div class="settings-section">
    <span class="settings-label adv-toggle" id="adv-toggle">Advanced <span class="adv-toggle-arrow">&#9658;</span></span>
    <div class="adv-section" id="adv-section">

<script type="module">

// In r152+ ColorManagement is enabled by default which shifts how
// hex colors are interpreted (sRGB → linear). Turning it off keeps
// our palette, shaders, and light intensities identical to the
// original r128 look without retuning every value.
THREE.ColorManagement.enabled = false;
// ════════════════════════════════════════════════════════
//  COLOR PALETTES & FONT SYSTEM
// ════════════════════════════════════════════════════════
const PALETTES = {

const FONT_SETS = {

};

let currentPalette = 'default';
let currentFontSet = 'grotesk';
let currentSpaceColor = '#06060b';
let currentStarColor = 'warm';

const SPACE_COLORS = [
  { key: '#06060b', label: 'Void' },
  { key: '#030318', label: 'Midnight' },
  { key: '#020617', label: 'Deep Sea' },

];

const spaceSwatchColors = {
  '#06060b': '#1e1c2e',
  '#030318': '#0d0d40',
  '#020617': '#071840',
  '#0c0604': '#2e150c',
  '#060a06': '#111f11',
  '#12001a': '#340050',
  '#0a0a0a': '#282828',
  '#000814': '#002060',
};

const STAR_COLORS = [
  { key: 'warm',  label: 'Warm',  r: 1.03, g: 1.0, b: 0.97 },
  { key: 'white', label: 'White', r: 1.0,  g: 1.0, b: 1.0  },
  { key: 'blue',  label: 'Blue',  r: 0.80, g: 0.90, b: 1.0  },
  { key: 'gold',  label: 'Gold',  r: 1.05, g: 0.95, b: 0.70 },
  { key: 'pink',  label: 'Pink',  r: 1.05, g: 0.80, b: 0.90 },
  { key: 'teal',  label: 'Teal',  r: 0.75, g: 1.0,  b: 0.95 },
];

const starLayers = [];

function applyPalette(key) {
  currentPalette = key;
  const p = PALETTES[key];
  const r = document.documentElement.style;
  r.setProperty('--portfolio', p.portfolio);
  r.setProperty('--experience', p.experience);
  r.setProperty('--skills', p.skills);
  r.setProperty('--education', p.education);
  r.setProperty('--about', p.about);
  r.setProperty('--void', p.void);

  // Update Three.js scene
  if (scene) {
    scene.background = new THREE.Color(p.fog);
    scene.fog = new THREE.FogExp2(p.fog, 0.003);
  }

  // Update CC lookup and rebuild orb colors
  CC.portfolio.hex = p.portfolio;  CC.portfolio.i = parseInt(p.portfolio.slice(1), 16);
  CC.experience.hex = p.experience; CC.experience.i = parseInt(p.experience.slice(1), 16);
  CC.skills.hex = p.skills;       CC.skills.i = parseInt(p.skills.slice(1), 16);
  CC.education.hex = p.education;  CC.education.i = parseInt(p.education.slice(1), 16);
  CC.about.hex = p.about;         CC.about.i = parseInt(p.about.slice(1), 16);

  // Update orb shader colors
  meshes.forEach((m, i) => {
    const c = new THREE.Color(CC[m.userData.category].i);
    if (m.material.uniforms && m.material.uniforms.uColor) {
      m.material.uniforms.uColor.value.set(c.r, c.g, c.b);
    }
    // Update glow sprite colors
    if (glows[i]) glows[i].material.color.setHex(CC[m.userData.category].i);
    // Update point light colors
    if (m.userData.pl) m.userData.pl.color.setHex(CC[m.userData.category].i);
  });

  // Update palette swatch active states
  document.querySelectorAll('.palette-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.palette === key);
  });
}

function applyFontSet(key) {
  currentFontSet = key;
  const f = FONT_SETS[key];
  const r = document.documentElement.style;
  r.setProperty('--display', f.display);
  r.setProperty('--body', f.body);
  r.setProperty('--mono', f.mono);
  document.querySelectorAll('.font-option').forEach(el => {
    el.classList.toggle('active', el.dataset.font === key);
  });
}

function applySpaceColor(hex) {
  currentSpaceColor = hex;
  document.documentElement.style.setProperty('--void', hex);
  const col = parseInt(hex.slice(1), 16);
  if (scene) {
    scene.background = new THREE.Color(col);
    scene.fog = new THREE.FogExp2(col, globalFogDensity);
  }
  document.querySelectorAll('.color-chip[data-space]').forEach(c => {
    c.classList.toggle('active', c.dataset.space === hex);
  });
  const inp = document.getElementById('space-hex-input');
  if (inp) inp.value = hex;
  const picker = document.getElementById('space-color-picker');
  if (picker) picker.value = hex;
}

const starSwatchColors = { warm: '#fff8e7', white: '#ffffff', blue: '#cce4ff', gold: '#ffe4a0', pink: '#ffd6eb', teal: '#c0fff6' };

function applyStarColor(key) {
  currentStarColor = key;
  const sc = STAR_COLORS.find(s => s.key === key);
  if (!sc) return;
  starLayers.forEach(({ points, baseColors, count }) => {
    const colors = points.geometry.attributes.color.array;
    for (let i = 0; i < count; i++) {
      const b = baseColors[i * 3 + 1]; // green channel = base brightness
      colors[i * 3]     = b * sc.r * globalStarIntensity;
      colors[i * 3 + 1] = b * sc.g * globalStarIntensity;
      colors[i * 3 + 2] = b * sc.b * globalStarIntensity;
    }
    points.geometry.attributes.color.needsUpdate = true;
  });
  document.querySelectorAll('.color-chip[data-star]').forEach(c => {
    c.classList.toggle('active', c.dataset.star === key);
  });
  const brandColor = starSwatchColors[key] || '#f0eeeb';
  const prefix = document.getElementById('brand-prefix');
  const suffix = document.getElementById('brand-suffix');
  if (prefix) prefix.style.color = brandColor;
  if (suffix) suffix.style.color = brandColor;
  const sinp = document.getElementById('star-hex-input');
  if (sinp) sinp.value = starSwatchColors[key] || '';
  const spicker = document.getElementById('star-color-picker');
  if (spicker && starSwatchColors[key]) spicker.value = starSwatchColors[key];
}

function applyStarHex(hex) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  const rr = parseInt(hex.slice(1,3),16)/255;
  const gg = parseInt(hex.slice(3,5),16)/255;
  const bb = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(rr,gg,bb) || 1;
  const sc = { r: rr/mx, g: gg/mx, b: bb/mx };
  currentStarColor = 'custom';
  starLayers.forEach(({ points, baseColors, count }) => {
    const colors = points.geometry.attributes.color.array;
    for (let i = 0; i < count; i++) {
      const b = baseColors[i*3+1];
      colors[i*3]   = b * sc.r * globalStarIntensity;
      colors[i*3+1] = b * sc.g * globalStarIntensity;
      colors[i*3+2] = b * sc.b * globalStarIntensity;
    }
    points.geometry.attributes.color.needsUpdate = true;
  });
  document.querySelectorAll('.color-chip[data-star]').forEach(c => c.classList.remove('active'));
  const prefix = document.getElementById('brand-prefix');
  const suffix = document.getElementById('brand-suffix');
  if (prefix) prefix.style.color = hex;
  if (suffix) suffix.style.color = hex;
}

function applyGlobalBrightness(v) {
  globalBrightness = v;
  refreshVisibility();
}

function applyGlobalFog(v) {
  globalFogDensity = v;
  if (scene && scene.fog) scene.fog.density = v;
}

function applyStarIntensity(v) {
  globalStarIntensity = v;
  if (currentStarColor !== 'custom') applyStarColor(currentStarColor);
}

function applyOrbVibrancy(v) {
  globalOrbVibrancy = v;
  glows.forEach(s => {
    s.userData.baseOp = s.userData.rawBaseOp * v;
    s.material.opacity = s.userData.baseOp;
  });
  hazes.forEach(h => {
    h.userData.baseOp = h.userData.rawBaseOp * v;
    h.material.opacity = h.userData.baseOp;
  });
}

function buildSettingsUI() {
  // Palettes
  const grid = document.getElementById('palette-grid');
  Object.entries(PALETTES).forEach(([key, p]) => {
    const swatch = document.createElement('div');
    swatch.className = 'palette-swatch' + (key === currentPalette ? ' active' : '');
    swatch.dataset.palette = key;
    swatch.innerHTML = '<div class="ps-colors">' +
      '<span style="background:' + p.portfolio + '"></span>' +
      '<span style="background:' + p.experience + '"></span>' +
      '<span style="background:' + p.skills + '"></span>' +
      '<span style="background:' + p.education + '"></span>' +
      '<span style="background:' + p.about + '"></span>' +
      '</div><span class="palette-name">' + p.name + '</span>';
    swatch.addEventListener('click', () => applyPalette(key));
    grid.appendChild(swatch);
  });

  // Fonts
  const fontList = document.getElementById('font-list');
  Object.entries(FONT_SETS).forEach(([key, f]) => {
    const opt = document.createElement('div');
    opt.className = 'font-option' + (key === currentFontSet ? ' active' : '');
    opt.dataset.font = key;
    opt.style.fontFamily = f.display;
    opt.textContent = f.name;
    opt.addEventListener('click', () => applyFontSet(key));
    fontList.appendChild(opt);
  });

  // Space color chips
  const spaceList = document.getElementById('space-color-list');
  SPACE_COLORS.forEach(sc => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (sc.key === currentSpaceColor ? ' active' : '');
    chip.dataset.space = sc.key;
    chip.title = sc.label;
    chip.style.background = spaceSwatchColors[sc.key] || sc.key;
    chip.style.border = '1px solid rgba(255,255,255,0.15)';
    chip.addEventListener('click', () => {
      applySpaceColor(sc.key);
      const inp = document.getElementById('space-hex-input');
      if (inp) inp.value = sc.key;
    });
    spaceList.appendChild(chip);
  });

  // Space hex input + native color picker
  const spaceHexInput = document.getElementById('space-hex-input');
  const spacePicker   = document.getElementById('space-color-picker');
  if (spaceHexInput) {
    spaceHexInput.value = currentSpaceColor;
    spaceHexInput.addEventListener('click', () => { if (spacePicker) spacePicker.click(); });
    spaceHexInput.addEventListener('input', () => {
      const val = spaceHexInput.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(val)) applySpaceColor(val);
    });
    spaceHexInput.addEventListener('keydown', e => { if (e.key === 'Enter') spaceHexInput.blur(); });
  }
  if (spacePicker) {
    spacePicker.addEventListener('input', () => {
      if (spaceHexInput) spaceHexInput.value = spacePicker.value;
      applySpaceColor(spacePicker.value);
    });
  }

  // Star color chips
  const starList = document.getElementById('star-color-list');
  STAR_COLORS.forEach(sc => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (sc.key === currentStarColor ? ' active' : '');
    chip.dataset.star = sc.key;
    chip.title = sc.label;
    chip.style.background = starSwatchColors[sc.key];
    chip.addEventListener('click', () => applyStarColor(sc.key));
    starList.appendChild(chip);
  });

  // Star custom hex input + native color picker
  const starHexInput = document.getElementById('star-hex-input');
  const starPicker   = document.getElementById('star-color-picker');
  if (starHexInput) {
    starHexInput.addEventListener('click', () => { if (starPicker) starPicker.click(); });
    starHexInput.addEventListener('input', () => {
      const val = starHexInput.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        if (starPicker) starPicker.value = val;
        applyStarHex(val);
      }
    });
    starHexInput.addEventListener('keydown', e => { if (e.key === 'Enter') starHexInput.blur(); });
  }
  if (starPicker) {
    starPicker.addEventListener('input', () => {
      if (starHexInput) starHexInput.value = starPicker.value;
      applyStarHex(starPicker.value);
    });
  }

  // Drift speed
  const driftRow = document.getElementById('drift-speed-row');
  const driftSpeeds = [
    { label: 'Off',    speed: 0,      enabled: false },
    { label: 'Slow',   speed: 0.0001, enabled: true  },
    { label: 'Normal', speed: 0.0003, enabled: true  },
    { label: 'Fast',   speed: 0.0008, enabled: true  },
  ];
  function updateDriftBtns() {
    driftRow.querySelectorAll('.drift-speed-btn').forEach((btn, i) => {
      const d = driftSpeeds[i];
      const isActive = !d.enabled ? !driftEnabled
        : driftEnabled && Math.abs(driftSpeed - d.speed) < 0.00001;
      btn.classList.toggle('active', isActive);
    });
  }
  driftSpeeds.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'drift-speed-btn';
    btn.textContent = d.label;
    btn.addEventListener('click', () => {
      if (!d.enabled) {
        driftEnabled = false;
        autoDrift = false;
      } else {
        driftEnabled = true;
        autoDrift = true;
        driftSpeed = d.speed;
      }
      updateDriftBtns();
    });
    driftRow.appendChild(btn);
  });
  updateDriftBtns();

  // Advanced settings section
  const advToggle  = document.getElementById('adv-toggle');
  const advSection = document.getElementById('adv-section');
  if (advToggle && advSection) {
    advToggle.addEventListener('click', () => {
      advToggle.classList.toggle('open');
      advSection.classList.toggle('open');
    });
  }
  const advSliders = document.getElementById('adv-sliders');
  if (advSliders) {
    const advDefs = [
      { id: 'adv-brightness', label: 'Scene Brightness', min: 0.2,   max: 2.0,   step: 0.05,   def: 1.0,   fmt: v => v.toFixed(2), fn: applyGlobalBrightness },
      { id: 'adv-fog',        label: 'Fog Density',      min: 0,     max: 0.012, step: 0.0005, def: 0.003, fmt: v => v.toFixed(4), fn: applyGlobalFog },
      { id: 'adv-stars',      label: 'Star Intensity',   min: 0.1,   max: 3.0,   step: 0.05,   def: 1.0,   fmt: v => v.toFixed(2), fn: applyStarIntensity },
      { id: 'adv-vibrancy',   label: 'Orb Vibrancy',     min: 0.1,   max: 3.0,   step: 0.05,   def: 1.0,   fmt: v => v.toFixed(2), fn: applyOrbVibrancy },
    ];
    advDefs.forEach(({ id, label, min, max, step, def, fmt, fn }) => {
      const row = document.createElement('div');
      row.className = 'slider-row';
      const valId = id + '-val';
      row.innerHTML = '<div class="slider-label-row"><span>' + label + '</span>' +
        '<span class="slider-val" id="' + valId + '">' + fmt(def) + '</span></div>' +
        '<input type="range" class="adv-slider" id="' + id + '" min="' + min +
        '" max="' + max + '" step="' + step + '" value="' + def + '">';
      advSliders.appendChild(row);
      row.querySelector('input').addEventListener('input', function() {
        const v = parseFloat(this.value);
        document.getElementById(valId).textContent = fmt(v);
        fn(v);
      });
    });
  }

  // Toggle
  const toggle = document.getElementById('settings-toggle');
  const panel = document.getElementById('settings-panel');
  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
    toggle.classList.toggle('active');
  });
}

// ════════════════════════════════════════════════════════
//  NEBULA SHADER (unselected orbs — planetary nebula look)
// ════════════════════════════════════════════════════════
const BUBBLE_VERT = `
  uniform float uTime;
  uniform float uDisplaceAmp;
  uniform float uDisplaceSpeed;
  uniform float uSelected;
  varying vec3  vNormal;
  varying vec3  vViewDir;
  varying vec3  vPosition;
  varying vec3  vWorldPos;
  varying float vRadial;

  void main() {
    vNormal   = normalize(normalMatrix * normal);
    vec4 worldPos = modelViewMatrix * vec4(position, 1.0);
    vViewDir  = normalize(-worldPos.xyz);
    vPosition = position;
    vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
    vRadial   = length(position);

    float d = 0.0;
    // Large-scale breathing — slow asymmetric deformation like expanding gas shells
    d += sin(position.x * 1.5  + uTime * uDisplaceSpeed * 0.30) * 0.40;
    d += sin(position.y * 2.0  + uTime * uDisplaceSpeed * 0.22) * 0.35;
    d += sin(position.z * 1.8  + uTime * uDisplaceSpeed * 0.28) * 0.30;
    d += sin((position.x + position.y) * 2.5 + uTime * uDisplaceSpeed * 0.18) * 0.25;
    // Very slow tidal bulge — makes the sphere feel like a gas cloud, not a ball
    d += sin(position.x * 0.8 + position.z * 0.6 + uTime * uDisplaceSpeed * 0.08) * 0.35;
    // Mid-frequency detail ripples
    d += sin(position.x * 4.0 + position.z * 3.0 + uTime * uDisplaceSpeed * 0.45) * 0.10;
    d += sin(position.y * 3.5 + position.x * 2.5 + uTime * uDisplaceSpeed * 0.32) * 0.08;

    float amp = uDisplaceAmp * mix(1.0, 3.0, uSelected);
    vec3 displaced = position + normal * d * amp;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
  }
`;

const BUBBLE_FRAG = `
  uniform float uTime;
  uniform vec3  uColor;
  uniform float uFresnelPower;
  uniform float uIridesFreq;
  uniform float uIridesIntensity;
  uniform float uSpecPower;
  uniform float uGlowIntensity;
  uniform float uBrightness;
  uniform float uSelected;

  varying vec3  vNormal;
  varying vec3  vViewDir;
  varying vec3  vPosition;
  varying vec3  vWorldPos;
  varying float vRadial;

  float hash(vec3 p) {
    p = fract(p * 0.3183099 + 0.1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }

  float noise3d(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
          mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
      mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
          mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  }

  float fbm(vec3 p) {
    float v = 0.0, a = 0.5;
    vec3 shift = vec3(100.0);
    for (int i = 0; i < 5; i++) {
      v += a * noise3d(p);
      p = p * 2.0 + shift;
      a *= 0.5;
    }
    return v;
  }

  float warpedFbm(vec3 p, float t) {
    vec3 q = vec3(
      fbm(p + vec3(0.0, 0.0, 0.0) + t * 0.04),
      fbm(p + vec3(5.2, 1.3, 2.8) - t * 0.03),
      fbm(p + vec3(1.7, 9.2, 4.1) + t * 0.02)
    );
    return fbm(p + 3.0 * q);
  }

  void main() {
    vec3  N = normalize(vNormal);
    vec3  V = normalize(vViewDir);
    float NdotV  = max(dot(N, V), 0.0);
    float fresnel = pow(1.0 - NdotV, uFresnelPower);

    // Object-space radial distance, normalized. This is STABLE as you orbit —
    // the shell structure is baked to the geometry, not the view angle.
    float r = clamp(vRadial / 1.6, 0.0, 1.0);

    // Gas turbulence
    vec3 noiseCoord = vPosition * 2.5;
    float turb    = warpedFbm(noiseCoord, uTime);
    float turb2   = fbm(noiseCoord * 1.8 + uTime * 0.06);
    float filament = pow(turb, 1.5);
    float wisps    = pow(turb2, 2.0);

    // THREE distinct radial zones with WIDE transitions
    float innerMask = 1.0 - smoothstep(0.0, 0.5, r);
    float midMask   = smoothstep(0.2, 0.5, r) * (1.0 - smoothstep(0.5, 0.8, r));
    float outerMask = smoothstep(0.5, 0.85, r);

    // Inner: blue-violet ionized gas
    vec3 innerCol = mix(vec3(0.25, 0.30, 0.70), vec3(0.55, 0.45, 0.80), turb);
    innerCol += vec3(0.10, 0.18, 0.05) * wisps * 0.6;

    // Outer: warm category-colored rim (NOT blown out — note the restrained multipliers)
    vec3 warmRim = uColor * (0.8 + filament * 0.6);
    warmRim += vec3(0.25, 0.15, 0.02) * outerMask * (0.5 + turb * 0.5);

    vec3 gasColor = innerCol * innerMask
                  + mix(innerCol, warmRim, 0.5) * midMask
                  + warmRim * outerMask;

    // Central star — object-space, view-independent
    float coreDist = length(vPosition) / 1.6;
    float coreGlow = exp(-coreDist * coreDist * 18.0);
    float coreStar = exp(-coreDist * coreDist * 80.0);
    vec3 coreColor = vec3(1.0, 0.98, 0.92) * coreStar * 3.0
                   + vec3(0.70, 0.80, 1.0) * coreGlow * 1.2;

    // Volumetric alpha
    float shellDensity = smoothstep(0.0, 0.3, r) * (1.0 - smoothstep(0.85, 1.0, r));
    float gasAlpha = shellDensity * (0.5 + filament * 0.4)
                   + innerMask * (0.15 + turb * 0.15)
                   + outerMask * (0.6 + turb * 0.3);
    gasAlpha += fresnel * 0.25;
    gasAlpha = max(gasAlpha, coreGlow * 0.9 + coreStar);

    // Rim emission — gentler than before
    float rimEmission = pow(fresnel, 2.5) * 0.6;
    vec3 rimColor = uColor * rimEmission;

    // Soft specular
    vec3  L1 = normalize(vec3(40.0, 60.0, 30.0));
    vec3  H1 = normalize(L1 + V);
    float spec = pow(max(dot(N, H1), 0.0), 32.0) * 0.15;

    vec3 col = gasColor * (0.6 + filament * 0.4)
             + coreColor
             + rimColor
             + vec3(1.0) * spec;

    float alpha = clamp(gasAlpha, 0.0, 1.0);

    // Selected fallback
    vec3  soapRim = vec3(0.82, 0.95, 1.0) * 1.35;
    float rimMask = uSelected * pow(fresnel, 1.8);
    col   = mix(col, soapRim, rimMask * 0.95);
    alpha = mix(alpha, alpha * 0.38, rimMask);

    gl_FragColor = vec4(col * uBrightness, clamp(alpha, 0.0, 1.0));
  }
`;

const SOAP_VERT = `
  uniform float uTime;
  uniform float uDisplaceAmp;
  uniform float uDisplaceSpeed;

  varying vec3 vNormal;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;

  void main() {

    vWorldPos  = wp.xyz;
    vNormal    = normalize(mat3(modelMatrix) * normal);
    vViewDir   = normalize(cameraPosition - vWorldPos);

    float d = 0.0;
    d += sin(position.x * 2.0  + uTime * uDisplaceSpeed * 1.2) * 0.35;
    d += sin(position.y * 3.0  + uTime * uDisplaceSpeed * 0.8) * 0.25;
    d += sin(position.z * 2.5  + uTime * uDisplaceSpeed * 1.0) * 0.20;
    d += sin((position.x + position.y) * 4.0 + uTime * uDisplaceSpeed * 1.5) * 0.20;
    // Extra gentle wobble for organic feel
    d += sin(position.x * 7.0 + position.y * 5.0 + uTime * uDisplaceSpeed * 0.4) * 0.08;
    vec3 displaced = position + normal * d * uDisplaceAmp;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
  }
`;

const SOAP_FRAG = `
  uniform float uTime;
  uniform float uFilmIOR;
  uniform float uThicknessBase;
  uniform float uThicknessRange;
  uniform float uBrightness;

  varying vec3 vNormal;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;

  // Enhanced procedural env with more reflections
  vec3 sampleEnv(vec3 R) {
    vec3 col = vec3(0.015, 0.015, 0.028);
    col += vec3(0.04, 0.05, 0.09) * pow(max(R.y, 0.0), 2.0);
    // Key light — bright hotspot
    float k1 = max(dot(R, normalize(vec3( 0.70,  0.55, -0.45))), 0.0);
    col += vec3(0.55, 0.52, 0.48) * pow(k1, 22.0);
    // Cool blue fill
    float k2 = max(dot(R, normalize(vec3(-0.65,  0.30,  0.40))), 0.0);
    col += vec3(0.06, 0.10, 0.24) * pow(k2, 8.0);
    // Cold rim
    float k3 = max(dot(R, normalize(vec3( 0.10, -0.25, -0.96))), 0.0);
    col += vec3(0.06, 0.09, 0.16) * pow(k3, 22.0);
    // Warm secondary
    float k4 = max(dot(R, normalize(vec3(-0.4, 0.7, 0.2))), 0.0);
    col += vec3(0.08, 0.04, 0.12) * pow(k4, 12.0);
    return col;
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(vViewDir);

    float cosT1  = max(dot(N, V), 0.0);
    float cosT2  = sqrt(max(0.0, 1.0 - (1.0 - cosT1 * cosT1) / (uFilmIOR * uFilmIOR)));

    // Thickness with more organic variation
    float thick = uThicknessBase
      + uThicknessRange * (0.5 + 0.5 * sin(N.y * 2.5 + uTime * 0.25))
      + 55.0 * sin(N.x * 2.0 + N.z * 1.5 + uTime * 0.12)
      + 30.0 * sin(N.x * 4.0 + N.y * 3.0 - uTime * 0.18)
      + 15.0 * cos(N.z * 5.0 + N.x * 2.5 + uTime * 0.08);

    float opd = 2.0 * uFilmIOR * thick * cosT2;

    // Per-wavelength thin-film interference
    vec3 irides = vec3(
      0.5 - 0.5 * cos(6.28318 * opd / 650.0),
      0.5 - 0.5 * cos(6.28318 * opd / 510.0),
      0.5 - 0.5 * cos(6.28318 * opd / 475.0)
    );

    // Softer desaturation
    float luma = dot(irides, vec3(0.299, 0.587, 0.114));
    vec3 irides_soft = mix(vec3(luma), irides, 0.55);
    irides_soft = mix(irides_soft, vec3(0.72, 0.86, 1.0), 0.22);

    // Schlick Fresnel
    float r0 = (uFilmIOR - 1.0) / (uFilmIOR + 1.0);
    float R0 = r0 * r0;
    float F  = R0 + (1.0 - R0) * pow(1.0 - cosT1, 5.0);

    vec3 Rdir   = reflect(-V, N);
    vec3 envCol = sampleEnv(Rdir);

    // Dual specular for more realism
    vec3  L1   = normalize(vec3(40.0, 60.0, 30.0));
    vec3  H1   = normalize(L1 + V);
    float spec1 = pow(max(dot(N, H1), 0.0), 256.0);
    vec3  L2   = normalize(vec3(-25.0, 40.0, -20.0));
    vec3  H2   = normalize(L2 + V);
    float spec2 = pow(max(dot(N, H2), 0.0), 180.0) * 0.4;

    vec3 col = irides_soft * (F * 1.3 + 0.05) * (vec3(0.88) + envCol)
             + vec3(1.0) * spec1 * 0.85
             + vec3(0.9, 0.95, 1.0) * spec2 * 0.5;

    float alpha = mix(0.025, 0.85, F);
    alpha = max(alpha, spec1 * 0.78 + spec2 * 0.3);

    gl_FragColor = vec4(col * uBrightness, clamp(alpha, 0.0, 1.0));
  }
`;

};
const CATS = Object.keys(RESUME);
const SPREAD = 45;

function getStartYear(item, cat) {
  if (cat === 'experience' && item.meta && item.meta.Period) {
    const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
    const m = item.meta.Period.match(/([A-Za-z]{3})\s+(\d{4})/);
    if (m) return parseInt(m[2]) + (MONTHS[m[1]] ?? 0) / 12;
    const y = item.meta.Period.match(/\d{4}/);
    return y ? parseInt(y[0]) : null;
  }
  if (cat === 'education' && item.meta && item.meta.Year) {
    return parseInt(item.meta.Year);
  }
  return null;
}

const CAT_CENTERS = {};
const GOLDEN_ANG = Math.PI * (3 - Math.sqrt(5));
const HELIX_R    = 9;
const HELIX_STEP = 4.5;

const NL = [];
CATS.forEach((cat, ci) => {
  const a  = (ci / CATS.length) * Math.PI * 2 - Math.PI * 0.5;
  const cx = Math.cos(a) * SPREAD;
  const cz = Math.sin(a) * SPREAD;

  if (cat === 'experience' || cat === 'education') {
    const items = RESUME[cat].slice().sort(
      (p, q) => (getStartYear(p, cat) || 0) - (getStartYear(q, cat) || 0)
    );
    const n     = items.length;
    const baseY = -((n - 1) * HELIX_STEP) / 2;
    const topY  = baseY + (n - 1) * HELIX_STEP;
    CAT_CENTERS[cat] = { cx, cz, labelY: topY + 9 };

    items.forEach((item, ii) => {
      NL.push({
        ...item, category: cat,
        pos: {
          x: cx + Math.cos(ii * GOLDEN_ANG) * HELIX_R,
          y: baseY + ii * HELIX_STEP,
          z: cz + Math.sin(ii * GOLDEN_ANG) * HELIX_R,
        },
        size: 1.55,
      });
    });

  } else {
    const items    = RESUME[cat];
    const n        = items.length;
    const clusterR = 4 + n * 1.5;
    CAT_CENTERS[cat] = { cx, cz, labelY: 15 };

    items.forEach((item, ii) => {
      const sa = (ii / Math.max(n, 1)) * Math.PI * 2;
      NL.push({
        ...item, category: cat,
        pos: {
          x: cx + Math.cos(sa) * clusterR,
          y: (Math.random() - 0.5) * 7,
          z: cz + Math.sin(sa) * clusterR,
        },
        size: cat === 'about' ? 3 : cat === 'portfolio' ? 2.2 : 1.6,
      });
    });
  }
});

(function() {
  const applicable = NL.filter(d => d.category === 'experience' || d.category === 'education');
  let minY = Infinity, maxY = -Infinity;
  applicable.forEach(d => {
    const y = getStartYear(d, d.category);
    d._startYear = y;
    if (y !== null) { minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  });
  applicable.forEach(d => {
    d.yearFactor = (d._startYear !== null && minY !== maxY)
      ? (d._startYear - minY) / (maxY - minY)
      : 1;
  });
})();

// ════════════════════════════════════════════════════════
//  SHOOTING STARS
// ════════════════════════════════════════════════════════
let shootingStars = [];
const SHOOTING_STAR_POOL = 5;

function createShootingStar() {
  const points = [];
  for (let i = 0; i < 20; i++) {
    points.push(new THREE.Vector3(i * 0.5, 0, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  
  // Gradient opacity along the trail
  const colors = new Float32Array(20 * 3);
  for (let i = 0; i < 20; i++) {
    const t = i / 19;
    const brightness = t * t; // Brighter at head
    colors[i * 3] = brightness;
    colors[i * 3 + 1] = brightness;
    colors[i * 3 + 2] = brightness;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const line = new THREE.Line(geo, mat);
  line.visible = false;
  scene.add(line);

  return {
    line,
    active: false,
    progress: 0,
    speed: 0,
    startPos: new THREE.Vector3(),
    direction: new THREE.Vector3(),
    lifetime: 0,
    delay: Math.random() * 20 + 5, // 5-25 seconds between spawns
    timer: Math.random() * 10, // stagger initial spawn
  };
}

function initShootingStars() {
  for (let i = 0; i < SHOOTING_STAR_POOL; i++) {
    shootingStars.push(createShootingStar());
  }
}

function spawnShootingStar(star) {
  // Random position in the far background
  const spread = 250;
  star.startPos.set(
    (Math.random() - 0.5) * spread,
    50 + Math.random() * 120,
    (Math.random() - 0.5) * spread - 80
  );

  // Random downward-ish diagonal direction
  star.direction.set(
    (Math.random() - 0.5) * 2,
    -0.5 - Math.random() * 0.5,
    (Math.random() - 0.5)
  ).normalize();

  star.speed = 80 + Math.random() * 120;
  star.lifetime = 0.6 + Math.random() * 0.8;
  star.progress = 0;
  star.active = true;
  star.line.visible = true;
}

function updateShootingStars(dt) {
  shootingStars.forEach(star => {
    if (!star.active) {
      star.timer += dt;
      if (star.timer >= star.delay) {
        star.timer = 0;
        star.delay = Math.random() * 25 + 8;
        spawnShootingStar(star);
      }
      return;
    }

    star.progress += dt;
    const t = star.progress / star.lifetime;

    if (t >= 1) {
      star.active = false;
      star.line.visible = false;
      star.line.material.opacity = 0;
      return;
    }

    // Fade: ramp up quickly, fade out slowly
    const fade = t < 0.1 ? t / 0.1 : 1 - Math.pow((t - 0.1) / 0.9, 2);
    star.line.material.opacity = fade * 0.7;

    // Update position — trail follows the head
    const headPos = star.startPos.clone().addScaledVector(star.direction, star.speed * star.progress);
    const positions = star.line.geometry.attributes.position;
    for (let i = 0; i < 20; i++) {
      const trailT = i / 19;
      const trailPos = headPos.clone().addScaledVector(star.direction, -(1 - trailT) * 8);
      positions.setXYZ(i, trailPos.x, trailPos.y, trailPos.z);
    }
    positions.needsUpdate = true;
  });
}
